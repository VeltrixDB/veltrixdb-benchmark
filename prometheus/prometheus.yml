global:
  scrape_interval:     5s
  evaluation_interval: 5s
  scrape_timeout:      4s

rule_files:
  - /etc/prometheus/recording-rules.yml

alerting:
  alertmanagers: []

scrape_configs:

  # ── VeltrixDB ────────────────────────────────────────────────────────────────
  - job_name: veltrixdb
    static_configs:
      - targets: ['veltrixdb:2112']
    metrics_path: /metrics
    scrape_interval: 5s

  # ── Prometheus self-monitoring ────────────────────────────────────────────────
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
